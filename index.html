const isFlow=x=>x.n.startsWith('FLOW CUMBUCO');

function data(k){
  let d=RAW[k].map(x=>({...x}));
  if(k==='acu'&&adjust){
    const mm={};RAW.mes.forEach(x=>mm[x.n]=x.v);
    d.forEach(x=>{if(x.e==='DIAGONAL')x.v=mm[x.n]||0});
  }
  if(!flow)d=d.filter(x=>!isFlow(x));
  return d;
}
function agg(d,key='e'){
  const v=sum(d,x=>x.v),m=sum(d,x=>x.m);
  const wm=d.filter(x=>x.m>0),vw=sum(wm,x=>x.v),mw=sum(wm,x=>x.m);
  const nm=d.filter(x=>x.m===0&&x.v>0);
  const by={};if(key==='e')['VICTA','DIAGONAL INC','DIAGONAL'].forEach(k=>by[k]={v:0,m:0,u:0,mu:0});
  d.forEach(x=>{const b=by[x[key]]=by[x[key]]||{v:0,m:0,u:0,mu:0};b.v+=x.v;b.m+=x.m;b.u+=x.u;b.mu+=x.mu});
  return {ma:sum(d,x=>x.ma||0),v,m,gap:v-m,pct:m?v/m*100:0,gp:m?(v-m)/m*100:0,vw,mw,pw:mw?vw/mw*100:0,nm,vnm:sum(nm,x=>x.v),by,u:sum(d,x=>x.u),mu:sum(d,x=>x.mu)};
}
const tone=p=>p>=100?'g':p>=80?'w':'b';
const icon=p=>p>=100?'▲':'▼';

/* ---------- charts ---------- */
function ring(p){
  const r=46,c=2*Math.PI*r,f=Math.min(p,100)/100*c,col=p>=100?'var(--good)':p>=80?'#d19a00':'var(--bad)';
  return `<svg viewBox="0 0 112 112" role="img" aria-label="Atingimento ${P(p)}"><circle cx="56" cy="56" r="${r}" fill="none" stroke="#dbe8e0" stroke-width="12"/><circle cx="56" cy="56" r="${r}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${f} ${c}" transform="rotate(-90 56 56)"/><text x="56" y="61" text-anchor="middle" font-size="20" font-weight="800" fill="#0d2219">${P(p,0)}</text></svg>`;
}
function compare(a){ // realizado x desafio, 2 barras horizontais
  const mx=Math.max(a.v,a.m)*1.0,W=300;
  const w=x=>Math.max(2,x/mx*(W-70));
  return `<svg viewBox="0 0 ${W} 92" role="img" aria-label="Realizado ${M(a.v)} versus desafio ${M(a.m)}">
  <text x="0" y="12" font-size="11" fill="#46594f">Realizado</text>
  <rect class="tp" data-t="Realizado: ${R(a.v)}" x="0" y="18" width="${w(a.v)}" height="22" rx="4" fill="var(--real)"/>
  <text x="${w(a.v)+6}" y="34" font-size="12" font-weight="700" fill="#0d2219">${M(a.v)}</text>
  <text x="0" y="58" font-size="11" fill="#46594f">Desafio</text>
  <rect class="tp" data-t="Desafio: ${R(a.m)}" x="0" y="64" width="${w(a.m)}" height="22" rx="4" fill="var(--meta)"/>
  <text x="${w(a.m)+6}" y="80" font-size="12" font-weight="700" fill="#0d2219">${M(a.m)}</text></svg>`;
}
function byEmp(a){
  const keys=Object.keys(a.by).filter(k=>a.by[k].v||a.by[k].m),mx=Math.max(1,...keys.map(k=>Math.max(a.by[k].v,a.by[k].m))),W=300,H=keys.length*62;
  const w=x=>Math.max(2,x/mx*(W-78));
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Realizado e desafio por item">`+keys.map((k,i)=>{
    const b=a.by[k],y=i*62,p=b.m?b.v/b.m*100:null;
    return `<text x="0" y="${y+11}" font-size="12" font-weight="700" fill="#0d2219">${lab(k)}</text>
    <text x="${W}" y="${y+11}" text-anchor="end" font-size="12" font-weight="700" fill="${p==null?'#7f9086':p>=100?'#0f7a4c':p>=80?'#9a6700':'#c2312d'}">${p==null?'s/ desafio':P(p,0)}</text>
    <rect class="tp" data-t="${lab(k)} · Realizado: ${R(b.v)}" x="0" y="${y+17}" width="${w(b.v)}" height="15" rx="3" fill="var(--real)"/>
    <text x="${w(b.v)+5}" y="${y+29}" font-size="11" fill="#46594f">${M(b.v)}</text>
    <rect class="tp" data-t="${lab(k)} · Desafio: ${R(b.m)}" x="0" y="${y+36}" width="${w(b.m)}" height="15" rx="3" fill="var(--meta)"/>
    <text x="${w(b.m)+5}" y="${y+48}" font-size="11" fill="#46594f">${M(b.m)}</text>`}).join('')+`</svg>`;
}
function waterfall(a){ // desafio -> variação por empresa -> realizado (evolução do gap)
  const keys=Object.keys(a.by).filter(k=>a.by[k].v||a.by[k].m),steps=[{l:'Desafio',v:a.m,t:'tot'}];
  keys.forEach(k=>steps.push({l:lab(k).slice(0,9),v:a.by[k].v-a.by[k].m,t:'d'}));
  steps.push({l:'Realizado',v:a.v,t:'tot'});
  const W=300,H=150,pad=22,mx=Math.max(a.m,a.v,a.m+Math.max(0,...keys.map(k=>a.by[k].v-a.by[k].m)))*1.12,
    y=v=>H-pad-v/mx*(H-pad-14),bw=Math.min(40,(W-10)/(steps.length*1.5)),gap=(W-bw*steps.length)/(steps.length-1);
  let run=0,out='';
  steps.forEach((s,i)=>{
    const x=i*(bw+gap);let top,bot,col;
    if(s.t==='tot'){top=s.v;bot=0;run=s.v;col=i?'var(--real)':'var(--meta)'}
    else{const a0=run,a1=run+s.v;top=Math.max(a0,a1);bot=Math.min(a0,a1);run=a1;col=s.v>=0?'var(--good)':'var(--bad)'}
    out+=`<rect class="tp" data-t="${s.l}: ${s.t==='tot'?R(s.v):SM(s.v)}" x="${x}" y="${y(top)}" width="${bw}" height="${Math.max(2,y(bot)-y(top))}" rx="3" fill="${col}"/>
    <text x="${x+bw/2}" y="${y(top)-4}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d2219">${s.t==='tot'?M(s.v,0):(s.v>0?'+':'')+M(s.v,1).replace('R$ ','')}</text>
    <text x="${x+bw/2}" y="${H-6}" text-anchor="middle" font-size="10" fill="#46594f">${s.l}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ponte do desafio ao realizado">${out}<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="#e0e9e3"/></svg>`;
}
function projRows(list,limit){
  return list.slice(0,limit).map(x=>{
    const has=x.m>0,p=has?x.v/x.m*100:null,d=x.v-x.m;
    return `<div class="row"><div class="nm">${x.n}</div><div class="vl ${has?(d>=0?'g':'b'):''}">${has?SM(d):'s/ desafio'}</div>
    ${has?`<div class="bar"><i style="width:${Math.min(p,150)/150*100}%"></i><u></u></div>`:''}
    <div class="det">${isAq(x)?'<b style="color:var(--warn)">⚠ Lançamento atrasado</b> · ':''}${has&&reason(x)?'<span style="color:var(--good);font-weight:600">ℹ '+reason(x)+'</span> · ':''}Realizado ${M(x.v)} · ${has?'Desafio '+M(x.m):'Desafio: '+(reason(x)||'não definida')}${has?` · ${P(p,0)}`:''}</div></div>`}).join('');
}

  $('#'+k).innerHTML=ctl(true)+`

  <div class="card exec"><h2>Análise executiva</h2><p class="sub">Resumo automático · setembro/2026</p>
   <p><span class="tag ${tg(am.pct)}">MÊS</span><b>${P(am.pct)} do desafio</b> (${M(am.v)} de ${M(am.m)}; ${SM(am.gap)}). Sem os empreendimentos sem desafio (Flow, Bosque Solar, Connect), seria <b>${P((am.v-antM)/am.m*100)}</b>.</p>
   <p><span class="tag ${tg(aa.pct)}">ACUMULADO</span><b>${P(aa.pct)} do desafio parcial</b> (${M(aa.v)} de ${M(aa.m)}; ${SM(aa.gap)}). Sem os empreendimentos sem desafio parcial, seria <b>${P((aa.v-antA)/aa.m*100)}</b>.</p>
   <p><span class="tag g">DESTAQUES</span>No mês: ${nmS(pos(wm))}. No acumulado: ${nmS(pos(wa))}.</p>
   <p><span class="tag b">ATENÇÃO</span>Maiores desvios no mês: ${nmS(neg(wm).slice(0,2))} (Aquiraz com lançamento atrasado, sem venda). Diagonal Inc abaixo do desafio no mês (${P(inc.v/inc.m*100,0)}) e no acumulado (${P(incA.v/incA.m*100,0)}).</p>
   <p><span class="tag n">CONCENTRAÇÃO</span>${lab(t1.n.replace(' CONDOMINIUM',''))} = ${P(t1.v/am.v*100,0)} do VGV do mês. Estoque de outubro: ${M(sum(RAW.est,x=>x.vg))} em VGV.</p>
  </div>`;
}

/* ---------- ui ---------- */
refresh();
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t));
  scrollTo({top:0,behavior:'smooth'});
});
const tip=$('#tip');
function bindTips(){
  document.querySelectorAll('.tp').forEach(el=>{
    const show=e=>{const p=e.touches?e.touches[0]:e;tip.textContent=el.dataset.t;tip.style.opacity=1;
      tip.style.left=Math.min(innerWidth-240,Math.max(8,p.clientX-60))+'px';tip.style.top=(p.clientY-52)+'px'};
    el.onmousemove=show;el.onclick=show;el.ontouchstart=show;el.onmouseleave=()=>tip.style.opacity=0;
  });
}
bindTips();
document.addEventListener('touchend',()=>setTimeout(()=>tip.style.opacity=0,1400));
</script>
